<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>대한민국CCTV | 영업사원 QR코드 생성기</title>
<link href="./대한민국CCTV _ 영업사원 QR코드 생성기_files/css2" rel="stylesheet">

<style>
:root {
  --navy: #0b1a3d;
  --blue: #1a5bb8;
  --red: #c8001e;
  --off: #f0f4fa;
  --border: #dce4f0;
  --gray: #6b7a99;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--off); font-family:'Noto Sans KR',sans-serif; color:var(--navy); min-height:100vh; }

.topbar { background:var(--navy); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
.topbar-logo { font-family:'Bebas Neue',sans-serif; font-size:18px; color:white; letter-spacing:.06em; }
.topbar-logo span { color:#7eb8ff; }
.topbar-badge { font-size:11px; color:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.15); border-radius:100px; padding:3px 10px; }

.wrap { max-width:700px; margin:0 auto; padding:28px 20px 60px; }

.page-title { font-size:20px; font-weight:900; margin-bottom:4px; }
.page-sub { font-size:13px; color:var(--gray); margin-bottom:24px; }

.card { background:white; border-radius:16px; padding:24px; border:1px solid var(--border); box-shadow:0 4px 20px rgba(11,26,61,.08); margin-bottom:16px; }
.card-title { font-size:14px; font-weight:700; margin-bottom:18px; display:flex; align-items:center; gap:8px; padding-bottom:14px; border-bottom:1px solid var(--off); }
.card-icon { width:32px; height:32px; background:linear-gradient(135deg,var(--navy),var(--blue)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }

.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; font-weight:700; color:var(--navy); margin-bottom:6px; }
.field input, .field textarea {
  width:100%; background:var(--off); border:1.5px solid transparent;
  border-radius:10px; padding:11px 14px; color:var(--navy);
  font-family:'Noto Sans KR',sans-serif; font-size:14px; outline:none;
  transition:border-color .2s; -webkit-appearance:none;
}
.field input:focus, .field textarea:focus { border-color:var(--blue); background:white; box-shadow:0 0 0 3px rgba(26,91,184,.08); }
.field input::placeholder, .field textarea::placeholder { color:#b0bace; }
.field textarea { resize:vertical; min-height:100px; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.url-preview { background:var(--off); border-radius:8px; padding:10px 13px; font-size:12px; color:var(--blue); font-family:monospace; word-break:break-all; margin-top:6px; border:1px solid var(--border); min-height:36px; line-height:1.6; }

.btn { border:none; border-radius:10px; padding:13px 20px; font-family:'Noto Sans KR',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:opacity .2s, transform .15s; }
.btn:hover { opacity:.9; transform:translateY(-1px); }
.btn:active { transform:translateY(0); }
.btn-primary { background:linear-gradient(135deg,var(--navy),var(--blue)); color:white; width:100%; margin-top:4px; }
.btn-secondary { background:var(--off); color:var(--navy); border:1.5px solid var(--border); }
.btn-secondary:hover { border-color:var(--blue); background:#e8efff; }
.btn-red { background:var(--red); color:white; }

/* QR 결과 */
.result-card { display:none; }
.result-top { display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap; }
.qr-wrap { background:white; border:2px solid var(--border); border-radius:12px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; flex-shrink:0; }
#qr-output canvas, #qr-output img { display:block; border-radius:4px; }
.qr-agent-label { font-size:11px; font-weight:700; color:var(--navy); text-align:center; }
.result-info { flex:1; min-width:180px; }
.result-info h3 { font-size:15px; font-weight:700; margin-bottom:12px; }
.info-row { display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
.info-label { font-size:11px; font-weight:700; color:var(--gray); min-width:65px; padding-top:1px; }
.info-val { font-size:12px; color:var(--navy); word-break:break-all; line-height:1.5; }
.info-val.code { font-family:monospace; background:var(--off); border-radius:5px; padding:2px 7px; font-size:13px; font-weight:700; color:var(--blue); }
.dl-row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.dl-row .btn { flex:1; min-width:120px; font-size:13px; padding:11px 14px; }

/* 배치 */
.batch-results { margin-top:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
.batch-item { background:var(--off); border-radius:10px; padding:12px; text-align:center; border:1px solid var(--border); }
.batch-item .bname { font-size:11px; font-weight:700; color:var(--navy); margin-bottom:6px; }
.batch-item .bcode { font-size:10px; color:var(--gray); margin-bottom:8px; }
.batch-item .bdl { font-size:11px; font-weight:700; color:var(--blue); background:#e8efff; border:none; border-radius:6px; padding:5px 10px; cursor:pointer; width:100%; font-family:'Noto Sans KR',sans-serif; }
.batch-item .bdl:hover { background:#d0e0ff; }

/* 안내 */
.guide { background:linear-gradient(135deg,#071228,#1a3fa0); border-radius:14px; padding:20px 22px; color:white; margin-top:16px; }
.guide-title { font-size:12px; font-weight:700; color:#7eb8ff; letter-spacing:.04em; margin-bottom:12px; }
.guide-steps { display:flex; flex-direction:column; gap:8px; }
.guide-step { display:flex; align-items:flex-start; gap:10px; }
.step-num { width:20px; height:20px; border-radius:50%; background:rgba(126,184,255,.2); border:1px solid rgba(126,184,255,.4); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#7eb8ff; flex-shrink:0; margin-top:1px; }
.step-txt { font-size:12px; color:rgba(255,255,255,.8); line-height:1.6; }
.step-txt strong { color:white; }

@media(max-width:480px) {
  .row2 { grid-template-columns:1fr; }
  .result-top { flex-direction:column; align-items:center; }
  .dl-row { flex-direction:column; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">대한민국<span>CCTV</span> 영업관리</div>
  <div class="topbar-badge">QR 생성 시스템</div>
</div>

<div class="wrap">
  <div class="page-title">📲 영업사원 QR코드 생성기</div>
  <p class="page-sub">영업사원 코드를 입력하면 개인 전용 QR코드가 자동 생성됩니다</p>

  <!-- 설정 카드 -->
  <div class="card">
    <div class="card-title">
      <div class="card-icon">⚙️</div>
      QR코드 설정
    </div>

    <div class="field">
      <label>랜딩 페이지 URL</label>
      <input type="url" id="base-url" value="https://fullhdcctv.github.io/cctv-landing" oninput="updatePreview()">
    </div>

    <div class="row2">
      <div class="field">
        <label>영업사원 코드 *</label>
        <input type="text" id="agent-code" placeholder="예: A001" maxlength="30" oninput="updatePreview()">
      </div>
      <div class="field">
        <label>영업사원 이름 (선택)</label>
        <input type="text" id="agent-name" placeholder="예: 홍길동" maxlength="20">
      </div>
    </div>

    <div class="field">
      <label>QR 연결 URL 미리보기</label>
      <div class="url-preview" id="url-preview">코드를 입력하면 URL이 표시됩니다</div>
    </div>

    <button class="btn btn-primary" onclick="generateQR()">🔲 QR코드 생성하기</button>
  </div>

  <!-- 결과 카드 -->
  <div class="card result-card" id="result-card">
    <div class="card-title">
      <div class="card-icon">✅</div>
      생성 완료
    </div>
    <div class="result-top">
      <div class="qr-wrap">
        <div id="qr-output"></div>
        <div class="qr-agent-label" id="qr-label">-</div>
      </div>
      <div class="result-info">
        <h3>QR코드 정보</h3>
        <div class="info-row"><div class="info-label">사원 코드</div><div class="info-val code" id="r-code">-</div></div>
        <div class="info-row"><div class="info-label">사원 이름</div><div class="info-val" id="r-name">-</div></div>
        <div class="info-row"><div class="info-label">연결 URL</div><div class="info-val" id="r-url" style="font-size:11px;color:var(--gray)">-</div></div>
        <div class="info-row"><div class="info-label">생성 시각</div><div class="info-val" id="r-time" style="font-size:11px;color:var(--gray)">-</div></div>
        <div class="dl-row">
          <button class="btn btn-primary" onclick="downloadQR()" style="font-size:13px;padding:11px 14px;">⬇ PNG 저장</button>
          <button class="btn btn-secondary" onclick="copyURL()" style="font-size:13px;padding:11px 14px;">🔗 URL 복사</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 배치 생성 -->
  <div class="card">
    <div class="card-title">
      <div class="card-icon">👥</div>
      여러 명 한번에 생성
    </div>
    <div class="field">
      <label>한 줄에 하나씩 입력 — 형식: <code style="background:var(--off);padding:2px 6px;border-radius:4px;font-size:11px">코드,이름</code></label>
      <textarea id="batch-input" placeholder="A001,홍길동
B002,김영희
C003,이철수"></textarea>
    </div>
    <button class="btn btn-secondary" onclick="generateBatch()" style="font-size:13px;padding:11px 20px;">📦 일괄 생성</button>
    <div class="batch-results" id="batch-results"></div>
  </div>

  <!-- 안내 -->
  <div class="guide">
    <div class="guide-title">📋 사용 방법</div>
    <div class="guide-steps">
      <div class="guide-step"><div class="step-num">1</div><div class="step-txt">영업사원 코드 입력 후 <strong>QR코드 생성</strong></div></div>
      <div class="guide-step"><div class="step-num">2</div><div class="step-txt"><strong>PNG 저장</strong> 후 스티커 인쇄소 전달</div></div>
      <div class="guide-step"><div class="step-num">3</div><div class="step-txt">고객이 QR 스캔 → 상담 신청 → <strong>Google Sheets 자동 저장</strong></div></div>
      <div class="guide-step"><div class="step-num">4</div><div class="step-txt">시트에서 <strong>영업사원별 실적</strong> 확인</div></div>
    </div>
  </div>
</div>

function getBase() {
  return document.getElementById('base-url').value.trim() || 'https://fullhdcctv.github.io/cctv-landing';
}

function updatePreview() {
  var code = document.getElementById('agent-code').value.trim();
  var preview = document.getElementById('url-preview');
  if (code) {
    currentURL = getBase() + '?agent=' + encodeURIComponent(code);
    preview.textContent = currentURL;
    preview.style.color = 'var(--blue)';
  } else {
    preview.textContent = '코드를 입력하면 URL이 표시됩니다';
    preview.style.color = 'var(--gray)';
  }
}

/* QR 캔버스 가운데에 ADT 로고 오버레이 */
function overlayLogo(canvas, callback) {
  var logo = new Image();
  logo.onload = function() {
    var ctx = canvas.getContext('2d');
    var logoSize = Math.round(canvas.width * 0.35);
    var x = Math.round((canvas.width  - logoSize) / 2);
    var y = Math.round((canvas.height - logoSize) / 2);
    ctx.save();
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/2, logoSize/2 + 6, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();
    ctx.drawImage(logo, x, y, logoSize, logoSize);
    /* QRCode.js가 canvas → img를 별도 생성하므로 img도 갱신 */
    var qrImg = canvas.parentNode ? canvas.parentNode.querySelector('img') : null;
    if (qrImg) { qrImg.src = canvas.toDataURL('image/png'); }
    if (callback) callback();
  };
  logo.src = ADT_LOGO_B64;
}

/* canvas가 생성될 때까지 안정적으로 기다리는 함수 */
function waitAndOverlay(container, callback) {
  var canvas = container.querySelector('canvas');
  if (canvas) { overlayLogo(canvas, callback); return; }
  var obs = new MutationObserver(function(mutations, o) {
    var c = container.querySelector('canvas');
    if (c) { o.disconnect(); overlayLogo(c, callback); }
  });
  obs.observe(container, { childList: true, subtree: true });
  /* 최대 2초 폴백 */
  var attempts = 0;
  var timer = setInterval(function() {
    var c = container.querySelector('canvas');
    if (c) { clearInterval(timer); obs.disconnect(); overlayLogo(c, callback); }
    if (++attempts > 20) clearInterval(timer);
  }, 100);
}

function generateQR() {
  var code = document.getElementById('agent-code').value.trim();
  var name = document.getElementById('agent-name').value.trim();
  if (!code) { alert('영업사원 코드를 입력해주세요!'); return; }

  currentURL = getBase() + '?agent=' + encodeURIComponent(code);

  var output = document.getElementById('qr-output');
  output.innerHTML = '';

  new QRCode(output, {
    text: currentURL,
    width: 180, height: 180,
    colorDark: '#0b1a3d',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });

  waitAndOverlay(output, null);

  document.getElementById('qr-label').textContent = name ? code + ' · ' + name : code;
  document.getElementById('r-code').textContent = code;
  document.getElementById('r-name').textContent = name || '(이름 없음)';
  document.getElementById('r-url').textContent = currentURL;
  document.getElementById('r-time').textContent = new Date().toLocaleString('ko-KR');

  var card = document.getElementById('result-card');
  card.style.display = 'block';
  setTimeout(function() { card.scrollIntoView({ behavior:'smooth', block:'start' }); }, 200);
}

function downloadQR() {
  var code = document.getElementById('agent-code').value.trim();
  var name = document.getElementById('agent-name').value.trim();
  setTimeout(function() {
    var canvas = document.querySelector('#qr-output canvas');
    if (!canvas) { alert('QR코드를 먼저 생성해주세요'); return; }
    var pad = 24, labelH = 30;
    var out = document.createElement('canvas');
    out.width  = canvas.width  + pad * 2;
    out.height = canvas.height + pad * 2 + labelH;
    var ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(canvas, pad, pad);  /* 로고 이미 canvas에 포함됨 */
    ctx.fillStyle = '#0b1a3d';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    var label = name ? code + ' · ' + name : code;
    ctx.fillText(label, out.width/2, canvas.height + pad + 20);
    var a = document.createElement('a');
    a.download = 'QR_' + code + (name ? '_' + name : '') + '.png';
    a.href = out.toDataURL('image/png');
    a.click();
  }, 200);
}

function copyURL() {
  if (!currentURL) { alert('QR코드를 먼저 생성해주세요'); return; }
  navigator.clipboard.writeText(currentURL).then(function() {
    var btn = event.target;
    var orig = btn.textContent;
    btn.textContent = '✅ 복사됨!';
    setTimeout(function() { btn.textContent = orig; }, 1500);
  });
}

function generateBatch() {
  var lines = document.getElementById('batch-input').value.trim().split('\n');
  var base = getBase();
  var container = document.getElementById('batch-results');
  container.innerHTML = '';

  lines.forEach(function(line) {
    line = line.trim();
    if (!line) return;
    var parts = line.split(',');
    var code = parts[0] ? parts[0].trim() : '';
    var name = parts[1] ? parts[1].trim() : '';
    if (!code) return;

    var url = base + '?agent=' + encodeURIComponent(code);
    var item = document.createElement('div');
    item.className = 'batch-item';

    var nameEl = document.createElement('div');
    nameEl.className = 'bname';
    nameEl.textContent = name || code;

    var codeEl = document.createElement('div');
    codeEl.className = 'bcode';
    codeEl.textContent = code;

    var qrWrap = document.createElement('div');
    qrWrap.style.cssText = 'margin:0 auto 8px;line-height:0;display:inline-block;';

    new QRCode(qrWrap, {
      text: url, width:100, height:100,
      colorDark:'#0b1a3d', colorLight:'#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    /* 배치 QR에도 로고 삽입 */
    (function(qw) {
      waitAndOverlay(qw, null);
    })(qrWrap);

    var dlBtn = document.createElement('button');
    dlBtn.className = 'bdl';
    dlBtn.textContent = '⬇ 저장';
    dlBtn.onclick = (function(c, n, qw) {
      return function() {
        setTimeout(function() {
          var canvas = qw.querySelector('canvas');
          if (!canvas) return;
          var pad = 12, lh = 22;
          var out = document.createElement('canvas');
          out.width  = canvas.width  + pad*2;
          out.height = canvas.height + pad*2 + lh;
          var ctx = out.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,out.width,out.height);
          ctx.drawImage(canvas, pad, pad); /* 로고 이미 포함 */
          ctx.fillStyle = '#0b1a3d'; ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          var label = n ? c + ' · ' + n : c;
          ctx.fillText(label, out.width/2, canvas.height+pad+15);
          var a = document.createElement('a');
          a.download = 'QR_' + c + (n ? '_'+n : '') + '.png';
          a.href = out.toDataURL('image/png'); a.click();
        }, 200);
      };
    })(code, name, qrWrap);

    item.appendChild(nameEl);
    item.appendChild(codeEl);
    item.appendChild(qrWrap);
    item.appendChild(dlBtn);
    container.appendChild(item);
  });
}
</script>
